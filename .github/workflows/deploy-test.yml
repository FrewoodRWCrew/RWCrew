name: Deploy test

# Runs on every push to develop. SSHes into the Hostinger VPS and re-runs
# deploy/scripts/deploy.sh inside /opt/rwcrew/test — see
# docs/deploying-to-hostinger.pdf, Step 8, for how SSH_HOST / SSH_USER /
# SSH_PRIVATE_KEY are set up as repo secrets (shared with the production
# workflow — same VPS, same deploy user).
#
# Changes that only touch mobile/ (the phone app) never redeploy the web app:
# the mobile app has its own release workflows (see CLAUDE.md, "Mobile app").
on:
  push:
    branches: [develop]
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/mobile-*.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/rwcrew/test/deploy/scripts/deploy.sh /opt/rwcrew/test
