# Reverse proxy for both RWCrew environments running on this VPS.
# Copy to /etc/nginx/sites-available/rwcrew.conf on the server and symlink
# into sites-enabled (see docs/deploying-to-hostinger.pdf, Step 5). Certbot
# rewrites the "listen 443"/certificate lines the first time it runs —
# the plain-HTTP server blocks below are what it needs to see beforehand
# to issue the certificates.
#
# Routing is by PATH, not subdomain, for the API: /api/* goes to the
# backend container, everything else to the frontend container, all under
# the SAME hostname the browser has open. This keeps frontend and backend
# on one origin so there is no cross-site cookie issue (see CLAUDE.md's
# NEXT_PUBLIC_API_URL / hostname-matching gotcha) and no CORS to reason
# about beyond what app/main.py already does.

# --- Production: rwcrew.eu / www.rwcrew.eu -> 127.0.0.1:3000 / :8020 ---
server {
    listen 80;
    listen [::]:80;
    server_name rwcrew.eu www.rwcrew.eu;

    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Test: test.rwcrew.eu -> 127.0.0.1:3100 / :8120 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.rwcrew.eu;

    location /api/ {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
