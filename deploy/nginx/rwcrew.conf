# Reverse proxy for both RWCrew environments running on this VPS.
# Copy to /etc/nginx/sites-available/rwcrew.conf on the server and symlink
# into sites-enabled (see docs/deploying-to-hostinger.pdf, Step 5). Certbot
# rewrites the "listen 443"/certificate lines the first time it runs —
# the plain-HTTP server blocks below are what it needs to see beforehand
# to issue the certificates.
#
# Routing is by PATH, not subdomain, for the API: /api/* goes to the
# backend container, everything else to the frontend container, all under
# the SAME hostname the browser has open. This keeps frontend and backend
# on one origin so there is no cross-site cookie issue (see CLAUDE.md's
# NEXT_PUBLIC_API_URL / hostname-matching gotcha) and no CORS to reason
# about beyond what app/main.py already does.

# Rate limit for the Raspberry Pi CSV intake endpoint (per client IP). The
# endpoint is public (API-key authenticated, PBKDF2 verify per request), so
# this caps brute-force / CPU-burn attempts. 30 req/min sustained is far
# above what a watcher polling every ~15 s needs.
limit_req_zone $binary_remote_addr zone=tagscan_intake:10m rate=30r/m;

# --- Production: rwcrew.eu / www.rwcrew.eu -> 127.0.0.1:3000 / :8020 ---
server {
    listen 80;
    listen [::]:80;
    server_name rwcrew.eu www.rwcrew.eu;

    # CSV uploads from the Raspberry Pi watchers. nginx's default body limit is
    # 1 MB, which would 413 larger files before FastAPI sees them; the app's own
    # limit is tagscan_intake_max_file_mb (20 MB), so stay slightly above it.
    location = /api/public/tagscan-intake {
        client_max_body_size 25m;
        limit_req zone=tagscan_intake burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Android app downloads (APK files built with EAS, see mobile/README.md).
    # Served straight from disk; the .apk MIME type makes phones offer to
    # install it instead of showing it as a zip/binary file.
    location /downloads/ {
        alias /opt/rwcrew/production/downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

