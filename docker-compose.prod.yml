# Production/test compose file. The SAME file is used for both the test and
# production environments on the Hostinger VPS — what makes each deployment
# distinct is which folder it's run from (each is its own "docker compose
# project", so containers/volumes/networks never collide) and its own .env
# file (see .env.production.example / .env.test.example). See
# docs/deploying-to-hostinger.pdf for the full setup.
#
# Frontend and backend ports are published to 127.0.0.1 only — they are
# reached from the outside world exclusively through the Nginx reverse
# proxy configured in deploy/nginx/rwcrew.conf, which also terminates TLS.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Published on the VPS's loopback address only (127.0.0.1), never on the
    # public internet. The backend still reaches it over the private
    # docker-compose network; this port exists so pgAdmin on a developer's PC
    # can read the database for debugging through an SSH tunnel (read-only
    # login, see deploy/scripts/create-readonly-db-user.sh). The ":?" makes
    # the deploy fail loudly if DB_HOST_PORT is missing from .env.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?set DB_HOST_PORT in .env}:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    # The VPS's own DNS resolver has been seen returning stale records for
    # our subdomains (e.g. an old IP for test.rwcrew.eu, left over from
    # before the domain moved to Cloudflare nameservers), which broke this
    # container's own outbound HTTPS calls to its public hostname. Public
    # resolvers don't have that stale cache.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TAGSCAN_SOURCE_DIR: /app/TagScans
      # TagScan routing by the CSV's "Mode" column: this environment's own
      # name, and the OTHER environment's intake URL + a scanner key made
      # there (see backend/app/modules/module_1/intake_forward.py).
      TAGSCAN_ENVIRONMENT: ${TAGSCAN_ENVIRONMENT:-}
      TAGSCAN_FORWARD_URL: ${TAGSCAN_FORWARD_URL:-}
      TAGSCAN_FORWARD_API_KEY: ${TAGSCAN_FORWARD_API_KEY:-}
      # Ops switch for TagScan's automatic background Scan (on/off and
      # interval themselves are set on TagScan's Settings screen).
      TAGSCAN_AUTO_SCAN_WORKER: ${TAGSCAN_AUTO_SCAN_WORKER:-true}
      # Outgoing email via Resend (backend/app/core/mail.py), e.g. the
      # Intervention Requests "new request" mail. Empty RESEND_API_KEY or
      # MAIL_FROM = mails are skipped (only a log line), never an error.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SUBJECT_PREFIX: ${MAIL_SUBJECT_PREFIX:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # The deployed version (commit date + short hash), exported by
      # deploy/scripts/deploy.sh and returned by /api/health.
      APP_COMMIT: ${APP_COMMIT:-}
      APP_COMMIT_DATE: ${APP_COMMIT_DATE:-}
    volumes:
      # TagScan's CSV intake folder (see backend/app/core/config.py's
      # tagscan_source_dir) — kept outside the container so uploaded/scanned
      # files survive an image rebuild.
      - tagscan_data:/app/TagScans
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8020"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time — see frontend/Dockerfile's comment on why
        # this can't be a plain runtime environment variable.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Public site address for QR codes on printed karbladen; optional.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        # Only set in test's .env — shows a "this isn't production" banner.
        NEXT_PUBLIC_ENVIRONMENT_LABEL: ${NEXT_PUBLIC_ENVIRONMENT_LABEL:-}
        # The deployed version shown in the left menu, exported by
        # deploy/scripts/deploy.sh. A new commit changes it, so the image is
        # always rebuilt with the right label.
        NEXT_PUBLIC_APP_COMMIT: ${APP_COMMIT:-}
        NEXT_PUBLIC_APP_COMMIT_DATE: ${APP_COMMIT_DATE:-}
    restart: unless-stopped
    depends_on:
      - backend
    # See the "backend" service's "dns" comment above — this container is
    # the one that actually does the affected outbound call, since server
    # components fetch the backend over its public hostname (server-api.ts).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"

volumes:
  db_data:
  tagscan_data:
